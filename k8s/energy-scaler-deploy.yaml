apiVersion: v1
kind: ServiceAccount
metadata:
  name: energy-scaler
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: energy-scaler
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: energy-scaler
subjects:
- kind: ServiceAccount
  name: energy-scaler
  namespace: default
roleRef:
  kind: ClusterRole
  name: energy-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-scaler
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energy-scaler
  template:
    metadata:
      labels:
        app: energy-scaler
    spec:
      serviceAccountName: energy-scaler
      containers:
      - name: scaler
        image: energy-scaler:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
